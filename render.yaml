services:
  - type: web
    name: GGBF6_WARZON_BOT
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m app.services.voice.prepare
    startCommand: uvicorn app.webhook:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHONPATH
        value: .
      - key: AI_ENABLED
        value: "1"
      - key: TELEGRAM_AAA_CONSOLE_ENABLED
        value: "1"
      - key: TELEGRAM_LIVE_DRAFTS_ENABLED
        value: "1"
      - key: WEBAPP_LIVE_STREAM_ENABLED
        value: "1"
      - key: WEBAPP_CINEMATIC_UI_ENABLED
        value: "1"
      - key: STORAGE_BACKEND
        value: auto
      - key: SUPABASE_URL
        value: https://wqriwhciqvrbhkkiuhxb.supabase.co
      - key: SUPABASE_SCHEMA
        value: public
      - key: STORAGE_TIMEOUT_S
        value: "8"
      - key: STORAGE_OUTBOX_MAX
        value: "500"
      - key: STORAGE_REPLAY_BATCH
        value: "50"
      - key: VOD_ENABLED
        value: "1"
      - key: VOD_MAX_BYTES
        value: "20971520"
      - key: VOD_MAX_FRAMES
        value: "8"
      - key: VOD_FRAME_WIDTH
        value: "1280"
      - key: VOICE_ENABLED
        value: "1"
      - key: VOICE_PROVIDER
        value: auto
      - key: VOICE_HIGH_FIDELITY_ENABLED
        value: "1"
      - key: VOICE_LOCAL_FALLBACK_ENABLED
        value: "1"
      - key: VOICE_OPENAI_MODEL
        value: gpt-4o-mini-tts
      - key: VOICE_OPENAI_VOICE
        value: marin
      - key: VOICE_OPENAI_TIMEOUT_S
        value: "45"
      - key: VOICE_MODEL_NAME
        value: ru_RU-denis-medium
      - key: VOICE_MODEL_DIR
        value: .bco_voice
      - key: VOICE_MAX_CHARS
        value: "1800"
      - key: VOICE_OPUS_BITRATE_KBPS
        value: "72"
      # OPENAI_API_KEY и SUPABASE_SERVICE_ROLE_KEY не хранить в публичном репозитории.
      # Добавить их только как server-side secrets в Render Dashboard.
