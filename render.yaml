services:
  - type: web
    name: GGBF6_WARZON_BOT
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.webhook:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHONPATH
        value: .
      - key: AI_ENABLED
        value: "1"
      - key: STORAGE_BACKEND
        value: auto
      - key: SUPABASE_URL
        value: https://wqriwhciqvrbhkkiuhxb.supabase.co
      - key: SUPABASE_SCHEMA
        value: public
      - key: STORAGE_TIMEOUT_S
        value: "8"
      - key: VOD_ENABLED
        value: "1"
      - key: VOD_MAX_BYTES
        value: "20971520"
      - key: VOD_MAX_FRAMES
        value: "8"
      - key: VOD_FRAME_WIDTH
        value: "1280"
      # OPENAI_API_KEY и SUPABASE_SERVICE_ROLE_KEY не хранить в публичном репозитории.
      # Добавить их только как server-side secrets в Render Dashboard.
