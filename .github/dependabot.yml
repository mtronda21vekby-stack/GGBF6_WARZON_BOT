version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:30'
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:45'
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
