name: BCO Intelligence CI

on:
  push:
    branches:
      - main
      - feature/bco-aaa-intelligence-v1
      - feature/bco-aaa-player-intelligence-v2
      - feature/bco-aaa-live-game-intelligence-v3
      - feature/bco-aaa-vod-intelligence-v4
      - feature/bco-aaa-voice-v5
  pull_request:
    branches:
      - main
      - feature/bco-aaa-intelligence-v1
      - feature/bco-aaa-player-intelligence-v2

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile
        run: python -m compileall app

      - name: Tests
        run: pytest -q

      - name: Import smoke
        run: python -c "from app.webhook import app; print(app.title)"
