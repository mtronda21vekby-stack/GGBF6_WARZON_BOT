name: BCO Intelligence CI

on:
  push:
    branches:
      - main
      - feature/bco-aaa-intelligence-v1
      - feature/bco-aaa-player-intelligence-v2
      - feature/bco-aaa-live-game-intelligence-v3
      - feature/bco-aaa-vod-intelligence-v4
      - feature/bco-aaa-voice-v5
      - feature/bco-aaa-command-center-v6
      - feature/bco-aaa-quality-v7
      - feature/bco-aaa-persistence-recovery-v8
      - feature/bco-aaa-production-readiness-v9
      - feature/bco-aaa-deployment-gate-v10
      - feature/bco-render-deploy-recovery-v11
      - feature/bco-aaa-abuse-guard-v12
      - feature/bco-live-intelligence-command-center-v18
      - feature/bco-voice-intelligence-v19
      - feature/bco-duplex-voice-v20
      - feature/bco-operator-twin-missions-v25
      - feature/bco-causal-operator-context-v26
      - feature/bco-mission-evidence-fusion-v27
      - feature/bco-longitudinal-operator-intelligence-v28
      - feature/bco-premium-deep-history-v29
  pull_request:
    branches:
      - main
      - feature/bco-aaa-intelligence-v1
      - feature/bco-aaa-player-intelligence-v2

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile
        run: python -m compileall app

      - name: Tests
        run: pytest -q

      - name: Import smoke
        run: python -c "from app.webhook import app; print(app.title, app.version)"

  render-deploy:
    name: render-deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.trigger.outputs.mode }}
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_DEPLOY_HOOK_FALLBACK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Trigger Render deploy when hook is configured
        id: trigger
        shell: bash
        run: |
          set -euo pipefail
          HOOK="${RENDER_DEPLOY_HOOK_URL:-${RENDER_DEPLOY_HOOK_FALLBACK:-}}"

          if [ -z "${HOOK}" ]; then
            echo "Render deploy trigger: none; relying on auto-deploy"
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Render deploy trigger: hook configured"
          http_code="$(curl -sS -X POST --connect-timeout 10 --max-time 30 \
            -o /tmp/render-deploy-response.json -w '%{http_code}' "${HOOK}" || true)"

          case "${http_code}" in
            200|202)
              echo "Render deploy hook accepted: HTTP ${http_code}"
              echo "mode=hook" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Render deploy hook failed: HTTP ${http_code:-000}"
              echo "mode=hook_failed" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
          esac

  production-smoke:
    name: production-smoke
    needs: [test, render-deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRODUCTION_URL: https://ggbf6-warzon-bot.onrender.com
      DEPLOY_TRIGGER_MODE: ${{ needs.render-deploy.outputs.mode }}
    steps:
      - name: Checkout release contract
        uses: actions/checkout@v4

      - name: Wait for Render release and persistent readiness
        shell: bash
        run: |
          set -u
          EXPECTED_VERSION="$(python -c 'from app.release import APP_VERSION; print(APP_VERSION)')"
          echo "Render deploy trigger mode=${DEPLOY_TRIGGER_MODE:-unknown}"
          echo "Waiting for BLACK CROWN OPS ${EXPECTED_VERSION} at ${PRODUCTION_URL}"
          rm -f /tmp/bco-health.json /tmp/bco-runtime.json /tmp/bco-live.js /tmp/bco-cinematic.css /tmp/bco-operator.js /tmp/bco-operator.css /tmp/bco-deep-history.js /tmp/bco-deep-api.json

          for attempt in $(seq 1 60); do
            http_code="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/bco-health.json -w '%{http_code}' "${PRODUCTION_URL}/health/details" || true)"
            if [ "${http_code}" = "200" ]; then
              if EXPECTED_VERSION="${EXPECTED_VERSION}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          try:
              payload = json.loads(Path('/tmp/bco-health.json').read_text(encoding='utf-8'))
          except Exception:
              raise SystemExit(1)

          recovery = ((payload.get('storage') or {}).get('recovery') or {})
          features = payload.get('features') or {}
          live = payload.get('live_intelligence') or {}
          voice = payload.get('voice_runtime') or {}
          operator = payload.get('operator_intelligence') or {}
          release = payload.get('release') or {}
          ok = (
              release.get('version') == os.environ['EXPECTED_VERSION']
              and payload.get('status') == 'ready'
              and features.get('persistent_memory_configured') is True
              and recovery.get('last_probe_ok') is True
              and recovery.get('primary_available') is True
              and features.get('abuse_guard') is True
              and features.get('telegram_replay_dedupe') is True
              and features.get('telegram_live_intelligence_drafts') is True
              and features.get('webapp_live_intelligence_stream') is True
              and features.get('webapp_cinematic_ui') is True
              and features.get('voice_input') is True
              and features.get('voice_input_confidence_gate') is True
              and features.get('voice_duplex_follow_input') is True
              and features.get('voice_high_fidelity') is True
              and features.get('operator_twin') is True
              and features.get('adaptive_mission_control') is True
              and features.get('operator_truth_calibration') is True
              and features.get('operator_session_lifecycle') is True
              and features.get('operator_context_bridge') is True
              and features.get('operator_causal_intelligence') is True
              and features.get('mission_vod_evidence_fusion') is True
              and features.get('mission_vod_evidence_no_autocomplete') is True
              and features.get('operator_longitudinal_intelligence') is True
              and features.get('operator_longitudinal_contradiction_detection') is True
              and features.get('operator_longitudinal_no_causal_claims') is True
              and features.get('premium_deep_history') is True
              and features.get('premium_deep_history_server_authoritative') is True
              and features.get('premium_client_authority') is False
              and features.get('premium_link_does_not_grant_entitlement') is True
              and operator.get('enabled') is True
              and operator.get('adaptive_missions') is True
              and operator.get('unknown_remains_unknown') is True
              and operator.get('context_bridge') is True
              and operator.get('shared_brain_context') is True
              and operator.get('context_schema') == 'bco_operator_context_v28'
              and operator.get('mission_evidence_fusion') is True
              and operator.get('mission_evidence_source') == 'vision_sampled_frames'
              and operator.get('mission_evidence_autocomplete') is False
              and operator.get('longitudinal_intelligence') is True
              and operator.get('longitudinal_schema') == 'bco_longitudinal_operator_v28'
              and operator.get('longitudinal_minimum_cycles') == 3
              and operator.get('longitudinal_contradiction_detection') is True
              and operator.get('longitudinal_association_rule') == 'association_not_causation'
              and operator.get('longitudinal_causal_claims') is False
              and operator.get('premium_deep_history') is True
              and operator.get('premium_deep_history_schema') == 'bco_premium_deep_history_v29'
              and operator.get('premium_deep_history_max_cycles') == 36
              and operator.get('premium_deep_history_authority') == 'server_bco_premium'
              and operator.get('premium_link_grants_entitlement') is False
              and operator.get('premium_client_authority') is False
              and voice.get('input_configured') is True
              and voice.get('transcription_model') == 'gpt-4o-transcribe'
              and voice.get('transcription_fallback_model') == 'gpt-4o-mini-transcribe'
              and voice.get('follow_input_enabled') is True
              and float(voice.get('transcription_confidence_threshold') or 0) > 0
              and voice.get('opus_bitrate_kbps') >= 64
              and live.get('final_message_authoritative') is True
              and live.get('webapp_transport') == 'ndjson'
          )
          raise SystemExit(0 if ok else 1)
          PY
              then
                runtime_code="$(curl -sS -X POST --connect-timeout 10 --max-time 20 -o /tmp/bco-runtime.json -w '%{http_code}' "${PRODUCTION_URL}/webapp/api/runtime" || true)"
                live_code="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/bco-live.js -w '%{http_code}' "${PRODUCTION_URL}/webapp/bco.live.js" || true)"
                css_code="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/bco-cinematic.css -w '%{http_code}' "${PRODUCTION_URL}/webapp/bco.cinematic.css" || true)"
                operator_js_code="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/bco-operator.js -w '%{http_code}' "${PRODUCTION_URL}/webapp/bco.operator.js" || true)"
                operator_css_code="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/bco-operator.css -w '%{http_code}' "${PRODUCTION_URL}/webapp/bco.operator.css" || true)"
                deep_js_code="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/bco-deep-history.js -w '%{http_code}' "${PRODUCTION_URL}/webapp/bco.deep-history.js" || true)"
                operator_api_code="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/bco-operator-api.json -w '%{http_code}' "${PRODUCTION_URL}/webapp/api/operator-intelligence" || true)"
                deep_api_code="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/bco-deep-api.json -w '%{http_code}' "${PRODUCTION_URL}/webapp/api/operator-deep-history" || true)"

                if [ "${runtime_code}" = "200" ] && [ "${live_code}" = "200" ] && [ "${css_code}" = "200" ] && \
                   [ "${operator_js_code}" = "200" ] && [ "${operator_css_code}" = "200" ] && [ "${deep_js_code}" = "200" ] && \
                   [ "${operator_api_code}" = "401" ] && [ "${deep_api_code}" = "401" ] && \
                   grep -q '"v18_overlay":true' /tmp/bco-runtime.json && \
                   grep -q 'Live Intelligence + Cinematic Runtime' /tmp/bco-live.js && \
                   grep -q 'Cinematic Technical Design System' /tmp/bco-cinematic.css && \
                   grep -q 'Operator Twin / Adaptive Mission Intelligence' /tmp/bco-operator.js && \
                   grep -q 'SAMPLED-FRAME ONLY / NO AUTO-COMPLETE' /tmp/bco-operator.js && \
                   grep -q 'server-authoritative entitlement only' /tmp/bco-deep-history.js && \
                   grep -q 'server_bco_premium' /tmp/bco-deep-history.js && \
                   grep -q 'Account linking alone does not unlock it' /tmp/bco-deep-history.js && \
                   grep -q 'Operator Twin technical dossier' /tmp/bco-operator.css; then
                  echo "Production verified: version=${EXPECTED_VERSION}, Supabase=OK, duplex voice=ON, live intelligence=ON, operator twin=ON, mission evidence=ON, longitudinal=ON, premium deep history=ON, server entitlement authority=ON, client premium authority=OFF"
                  cat /tmp/bco-health.json
                  cat /tmp/bco-runtime.json
                  exit 0
                fi
              fi
            fi

            echo "attempt=${attempt}/60 http=${http_code:-000} release not ready yet"
            sleep 10
          done

          echo "Production deployment gate failed after 10 minutes. Last response:"
          cat /tmp/bco-health.json 2>/dev/null || true
          cat /tmp/bco-runtime.json 2>/dev/null || true
          exit 1
