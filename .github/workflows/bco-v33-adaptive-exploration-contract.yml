name: BCO v33 Adaptive Exploration Contract

on:
  push:
    branches:
      - main
      - feature/bco-adaptive-exploration-budget-v33
  pull_request:
    branches:
      - main

jobs:
  v33-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile
        run: python -m compileall app
      - name: Tests
        run: pytest -q
      - name: Import smoke
        run: python -c "from app.webhook import app; print(app.title, app.version)"
      - name: Static exploration contract
        run: |
          grep -q 'bco_adaptive_exploration_budget_v33' app/services/operator_intelligence/exploration_budget.py
          grep -q 'REPEAT_LIMIT = 2' app/services/operator_intelligence/exploration_budget.py
          grep -q 'CLOSE_SCORE_GAP = 6' app/services/operator_intelligence/exploration_budget.py
          grep -q 'random_selection.*False' app/services/operator_intelligence/exploration_budget.py
          grep -q 'strong_signal_override' app/services/operator_intelligence/exploration_budget.py
          grep -q 'deterministic_evidence_backed_rotation_only' app/webapp/command_center_router.py
          grep -q 'EXPLORATION ≠ RANDOMNESS' app/webapp/static/bco.strategy.js
          grep -q 'ROTATION REQUIRES CLOSE EVIDENCE' app/webapp/static/bco.strategy.js
          grep -q 'ASSOCIATION ≠ CAUSATION' app/webapp/static/bco.strategy.js
          grep -q 'RECOMMENDATION ≠ FACT' app/webapp/static/bco.strategy.js
          grep -q 'EFFECTIVENESS ≠ CAUSAL PROOF' app/webapp/static/bco.strategy.js
          grep -q 'PORTFOLIO PRIOR ≠ CAUSAL PROOF' app/webapp/static/bco.strategy.js
          grep -q 'server-authoritative Premium' app/webapp/static/bco.strategy.js

  v33-production-smoke:
    needs: v33-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRODUCTION_URL: https://ggbf6-warzon-bot.onrender.com
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed adaptive exploration contract
        shell: bash
        run: |
          set -u
          EXPECTED_VERSION="$(python -c 'from app.release import APP_VERSION; print(APP_VERSION)')"
          EXPECTED_CONTRACT="$(python -c 'from app.release import RELEASE_CONTRACT; print(RELEASE_CONTRACT)')"
          for attempt in $(seq 1 60); do
            health_code="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/bco-v33-health.json -w '%{http_code}' "${PRODUCTION_URL}/health/details" || true)"
            if [ "${health_code}" = "200" ]; then
              if EXPECTED_VERSION="${EXPECTED_VERSION}" EXPECTED_CONTRACT="${EXPECTED_CONTRACT}" python - <<'PY'
          import json, os
          from pathlib import Path
          try:
              p = json.loads(Path('/tmp/bco-v33-health.json').read_text())
          except Exception:
              raise SystemExit(1)
          recovery = ((p.get('storage') or {}).get('recovery') or {})
          release = p.get('release') or {}
          ok = (
              release.get('version') == os.environ['EXPECTED_VERSION']
              and release.get('contract') == os.environ['EXPECTED_CONTRACT']
              and p.get('status') == 'ready'
              and recovery.get('primary_available') is True
              and recovery.get('last_probe_ok') is True
              and int(recovery.get('outbox_pending') or 0) == 0
          )
          raise SystemExit(0 if ok else 1)
          PY
              then
                js_code="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/bco-v33-strategy.js -w '%{http_code}' "${PRODUCTION_URL}/webapp/bco.strategy.js" || true)"
                api_code="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/bco-v33-api.json -w '%{http_code}' "${PRODUCTION_URL}/webapp/api/operator-strategy" || true)"
                if [ "${js_code}" = "200" ] && [ "${api_code}" = "401" ] && \
                   grep -q 'Adaptive Exploration Budget' /tmp/bco-v33-strategy.js && \
                   grep -q 'EXPLORATION ≠ RANDOMNESS' /tmp/bco-v33-strategy.js && \
                   grep -q 'ROTATION REQUIRES CLOSE EVIDENCE' /tmp/bco-v33-strategy.js && \
                   grep -q 'server-authoritative Premium' /tmp/bco-v33-strategy.js; then
                  echo "v33 production verified: version=${EXPECTED_VERSION}, contract=${EXPECTED_CONTRACT}, exploration_asset=ON, unauth_strategy=401, deterministic_rotation=ON"
                  cat /tmp/bco-v33-health.json
                  exit 0
                fi
              fi
            fi
            echo "v33 attempt=${attempt}/60 health=${health_code:-000} not ready"
            sleep 10
          done
          echo "v33 production contract failed"
          cat /tmp/bco-v33-health.json 2>/dev/null || true
          exit 1
