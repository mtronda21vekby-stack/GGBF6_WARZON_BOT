name: BCO Required Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/bco-*']
permissions:
  contents: read
jobs:
  required-gate:
    name: required-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip check
      - name: Compile
        run: python -m compileall app
      - name: Full regression suite
        run: pytest -q
      - name: Import smoke
        run: python -c "from app.webhook import app; print(app.title, app.version)"
      - name: Diff hygiene
        run: git diff --check
      - name: Secret and private-key guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          tracked=subprocess.check_output(['git','ls-files'],text=True).splitlines(); bad=[]; findings=[]
          allowed={'.env.example','.env.sample','.env.template'}
          patterns=[re.compile(r'\bsk-[A-Za-z0-9_-]{20,}\b'),re.compile(r'\bsb_secret_[A-Za-z0-9_-]{20,}\b'),re.compile(r'\b(?:ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})\b'),re.compile(r'\b\d{8,12}:[A-Za-z0-9_-]{30,}\b'),re.compile(r'-----BEGIN (?:RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----')]
          for raw in tracked:
              p=Path(raw); lower=p.name.lower()
              if lower.startswith('.env') and lower not in allowed: bad.append(raw)
              if p.suffix.lower() in {'.pem','.key','.p12','.pfx'}: bad.append(raw)
              try:
                  if p.stat().st_size>2_000_000: continue
                  text=p.read_text(encoding='utf-8')
              except Exception: continue
              if any(x.search(text) for x in patterns): findings.append(raw)
          if bad or findings:
              print('Security gate rejected tracked sensitive material.',bad,findings);sys.exit(1)
          print('secret/private-key guard: clean')
          PY
      - name: Release truth and authority contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.release import APP_VERSION, RELEASE_CONTRACT
          assert APP_VERSION == '43.0.0'
          assert RELEASE_CONTRACT == 'bco-personal-meta-v43'
          package=Path('app/services/operator_intelligence/__init__.py').read_text()
          wrapper=Path('app/services/operator_intelligence/orchestrated_service.py').read_text()
          orchestrator=Path('app/services/operator_intelligence/mission_orchestrator.py').read_text()
          strategy_ui=Path('app/webapp/static/bco.strategy.js').read_text()
          orch_ui=Path('app/webapp/static/bco.orchestrator.js').read_text()
          i18n=Path('app/i18n.py').read_text(); web_i18n=Path('app/webapp/static/bco.i18n.js').read_text(); router=Path('app/core/router.py').read_text(); analytics=Path('app/services/analytics/admin_usage.py').read_text(); brain_patch=Path('app/services/brain/locale_patch.py').read_text()
          voice_ui=Path('app/ui/crown_voice_console.py').read_text(); console=Path('app/services/telegram/command_console.py').read_text(); voice_backend=Path('app/services/voice/openai_backend.py').read_text(); bridge=Path('app/services/entitlements/site_bridge.py').read_text(); crown_intel=Path('app/services/brain/crown_intel_runtime.py').read_text(); ledger=Path('app/services/brain/crown_intel_ledger.py').read_text(); engine=Path('app/services/brain/engine.py').read_text(); live=Path('app/services/brain/live_official.py').read_text(); migration=Path('migrations/004_crown_intel_v43_ledger.sql').read_text()
          assert 'OrchestratedOperatorIntelligenceService as OperatorIntelligenceService' in package
          assert 'CurrentOperatorIntelligenceService' in wrapper
          assert 'bco_mission_orchestrator_v36' in orchestrator
          assert 'explicit_operator_report_only' in orchestrator
          for marker in ('ASSOCIATION ≠ CAUSATION','EFFECTIVENESS ≠ CAUSAL PROOF','PORTFOLIO PRIOR ≠ CAUSAL PROOF','EXPLORATION ≠ RANDOMNESS','STALE ≠ FALSE','SHIFT ≠ CAUSE','ONE SESSION ≠ REGIME'): assert marker in strategy_ui
          for marker in ('EXPLICIT OUTCOME ONLY','VOD CANNOT ADVANCE STAGE','STAGE ≠ PLAYER TRAIT'): assert marker in orch_ui
          assert 'detect_text_locale' in i18n and 'language_override' in i18n
          assert 'initDataUnsafe?.user?.language_code' in web_i18n
          assert 'document.documentElement.lang = locale' in web_i18n
          assert '/lang_en' in router and '/lang_ru' in router and '/lang_auto' in router
          assert 'BCO_ADMIN_TELEGRAM_USER_ID' in router and '/adminstats' in router
          assert 'server-side Supabase activity ledger' in analytics
          assert 'Respond in English' in brain_patch and 'Respond in Russian' in brain_patch
          for marker in ('CROWN VOICE // LIVE CONTROL','♀ FEMALE','♂ MALE','ON-DEMAND','bco:set:voiceid:female','bco:set:voiceid:male'): assert marker in voice_ui
          for marker in ('field == "voiceid"','voice_identity','tts_voice','field == "ttsmode"'): assert marker in console
          assert 'IDENTITY_DEFAULT_VOICES' in voice_backend and '"female": "marin"' in voice_backend and '"male": "cedar"' in voice_backend
          for marker in ('SiteIdentityAssertionVerifier','BLACKCROWN_SITE_BRIDGE_SECRET','x_bc_site_assertion','hmac.compare_digest','site_assertion_not_configured','/api/auth/session/verify','_ALLOWED_VERIFY_PATHS','site-session-verifier-v14'): assert marker in bridge
          for marker in ('zero_extra_paid_api','callofduty.com','ea.com','CROWN_INTEL_AUTONOMOUS_ENABLED','CROWN_INTEL_REFRESH_INTERVAL_S','warzone','bo7','bf6','ledger_enabled','last_change_count'): assert marker in crown_intel
          for marker in ('bco_game_intel_snapshots','bco_game_intel_changes','content_hash','added_blocks','removed_blocks','PersonalImpact','personalize'): assert marker in ledger
          for marker in ('CROWN INTEL CHANGE','CROWN ALERT:','CROWN ALERT SUPPRESSED','build_crown_intel_ledger'): assert marker in engine
          assert 'bco_game_intel_snapshots' in migration and 'bco_game_intel_changes' in migration and 'enable row level security' in migration
          assert '_ALLOWED_HOSTS' in live and 'callofduty.com' in live and 'ea.com' in live
          print('v43 release/personal-meta/crown-alert/game-ledger authority contract: clean')
          PY
