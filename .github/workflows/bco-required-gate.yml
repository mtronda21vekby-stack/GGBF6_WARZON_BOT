name: BCO Required Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feature/bco-*'

permissions:
  contents: read

jobs:
  required-gate:
    name: required-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip check

      - name: Compile
        run: python -m compileall app

      - name: Full regression suite
        run: pytest -q

      - name: Import smoke
        run: python -c "from app.webhook import app; print(app.title, app.version)"

      - name: Diff hygiene
        run: git diff --check

      - name: Secret and private-key guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          allowed_env = {'.env.example', '.env.sample', '.env.template'}
          forbidden_files = []
          findings = []

          patterns = {
              'openai_key': re.compile(r'\bsk-[A-Za-z0-9_-]{20,}\b'),
              'supabase_secret': re.compile(r'\bsb_secret_[A-Za-z0-9_-]{20,}\b'),
              'github_pat': re.compile(r'\b(?:ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})\b'),
              'slack_token': re.compile(r'\bxox[baprs]-[A-Za-z0-9-]{20,}\b'),
              'telegram_bot_token': re.compile(r'\b\d{8,12}:[A-Za-z0-9_-]{30,}\b'),
              'private_key': re.compile(r'-----BEGIN (?:RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----'),
          }

          for raw in tracked:
              path = Path(raw)
              lower = path.name.lower()
              if lower.startswith('.env') and lower not in allowed_env:
                  forbidden_files.append(raw)
              if path.suffix.lower() in {'.pem', '.key', '.p12', '.pfx'}:
                  forbidden_files.append(raw)
              try:
                  if path.stat().st_size > 2_000_000:
                      continue
                  text = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              for label, pattern in patterns.items():
                  if pattern.search(text):
                      findings.append((raw, label))

          if forbidden_files or findings:
              print('Security gate rejected tracked sensitive material.')
              for item in sorted(set(forbidden_files)):
                  print(f'forbidden_file: {item}')
              for path, label in findings:
                  print(f'credential_pattern: {label} in {path}')
              sys.exit(1)
          print('secret/private-key guard: clean')
          PY

      - name: Release truth and authority contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.release import APP_VERSION, RELEASE_CONTRACT

          assert APP_VERSION == '36.0.0'
          assert RELEASE_CONTRACT == 'bco-mission-orchestrator-v36'

          package = Path('app/services/operator_intelligence/__init__.py').read_text()
          wrapper = Path('app/services/operator_intelligence/orchestrated_service.py').read_text()
          orchestrator = Path('app/services/operator_intelligence/mission_orchestrator.py').read_text()
          portfolio = Path('app/services/operator_intelligence/strategy_portfolio.py').read_text()
          strategy = Path('app/services/operator_intelligence/adaptive_strategy.py').read_text()
          freshness = Path('app/services/operator_intelligence/evidence_freshness.py').read_text()
          regime = Path('app/services/operator_intelligence/regime_change.py').read_text()
          context = Path('app/services/operator_intelligence/context.py').read_text()
          prompt = Path('app/services/brain/operator_prompt.py').read_text()
          router = Path('app/webapp/command_center_router.py').read_text()
          strategy_ui = Path('app/webapp/static/bco.strategy.js').read_text()
          orch_ui = Path('app/webapp/static/bco.orchestrator.js').read_text()

          # Stable historical boundaries.
          assert 'bco_strategy_portfolio_v32' in portfolio
          assert 'exploration_is_deterministic' in strategy
          assert 'strong_signal_not_overridden_by_exploration' in strategy
          assert 'server_bco_premium' in router
          assert 'explicit_outcome_association_only' in router
          assert 'associative_outcome_calibration_only' in router
          assert 'deterministic_evidence_backed_rotation_only' in router

          # v34/v35 remain intact.
          assert 'bco_evidence_freshness_v34' in freshness
          assert 'FRESH_MAX_DAYS = 7' in freshness
          assert 'AGING_MAX_DAYS = 21' in freshness
          assert 'stale_is_not_false' in freshness
          assert 'bco_player_regime_change_v35' in regime
          assert 'MIN_CANDIDATE_CYCLES = 6' in regime
          assert 'MIN_CONFIRMED_CYCLES = 9' in regime
          assert 'one_session_can_change_regime' in regime
          assert 'shift_does_not_identify_cause' in regime
          assert 'external_meta_change_not_inferred' in regime

          # v36 orchestrator wraps the current v28 service, never the old v25 base.
          assert 'OrchestratedOperatorIntelligenceService as OperatorIntelligenceService' in package
          assert 'from app.services.operator_intelligence.v28 import OperatorIntelligenceService as CurrentOperatorIntelligenceService' in wrapper
          assert 'bco_mission_orchestrator_v36' in orchestrator
          for stage in ('CALIBRATION', 'CORRECTION', 'VALIDATION', 'STRESS_TEST', 'MAINTENANCE'):
              assert stage in orchestrator
          assert 'explicit_operator_report_only' in orchestrator
          assert 'vod_transition_authority' in orchestrator
          assert 'reported_without_verdict_advances_stage' in orchestrator
          assert 'stale_history_cannot_skip_current_recalibration' in orchestrator
          assert 'stage_is_training_state_not_player_fact' in orchestrator
          assert 'one_bad_match_does_not_reset_maintenance' in orchestrator
          assert 'MISSION_ORCHESTRATOR_ENABLED' in wrapper
          assert 'mission_orchestrator_authority' in router
          assert 'mission_stage_explicit_only' in context
          assert 'vod_cannot_advance_stage' in context
          assert 'transition_authority=explicit_operator_report_only' in prompt

          # Human-facing truth markers remain literal.
          for marker in (
              'ASSOCIATION ≠ CAUSATION',
              'EFFECTIVENESS ≠ CAUSAL PROOF',
              'PORTFOLIO PRIOR ≠ CAUSAL PROOF',
              'EXPLORATION ≠ RANDOMNESS',
              'STALE ≠ FALSE',
              'OLD SUPPORT ≠ CURRENT PROOF',
              'SHIFT ≠ CAUSE',
              'ONE SESSION ≠ REGIME',
              'META CHANGE NOT INFERRED',
          ):
              assert marker in strategy_ui
          for marker in (
              'EXPLICIT OUTCOME ONLY',
              'VOD CANNOT ADVANCE STAGE',
              'STAGE ≠ PLAYER TRAIT',
              'ONE BAD MATCH ≠ MAINTENANCE RESET',
          ):
              assert marker in orch_ui
          print('release/truth/authority contract: clean')
          PY
