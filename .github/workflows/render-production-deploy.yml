name: BCO Render Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: bco-render-production
  cancel-in-progress: true

env:
  PRODUCTION_URL: https://ggbf6-warzon-bot.onrender.com

jobs:
  deploy-production:
    name: deploy-and-verify-render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_DEPLOY_HOOK_FALLBACK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7

      - name: Publish pending production status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          payload = json.dumps({
              "state": "pending",
              "context": "bco/render-production",
              "description": "Render deploy and exact-build verification in progress",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode("utf-8")
          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status != 201:
                  raise SystemExit(f"pending status publish failed: HTTP {response.status}")
          PY

      - name: Trigger deploy hook or verify Render auto-deploy
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          HOOK="${RENDER_DEPLOY_HOOK_URL:-${RENDER_DEPLOY_HOOK_FALLBACK:-}}"
          if [ -z "$HOOK" ]; then
            echo "mode=render_auto_deploy" >> "$GITHUB_OUTPUT"
            echo "::notice::Render deploy hook is not configured; waiting for Render auto-deploy to publish the exact GitHub SHA."
            exit 0
          fi

          code="$(curl -sS -X POST --connect-timeout 10 --max-time 45 -o /tmp/render-response.txt -w '%{http_code}' "$HOOK" || true)"
          case "$code" in
            200|201|202|204)
              echo "mode=deploy_hook" >> "$GITHUB_OUTPUT"
              echo "Render deploy accepted: HTTP $code"
              ;;
            *)
              echo "::error::Render deploy hook failed: HTTP ${code:-000}"
              cat /tmp/render-response.txt || true
              exit 1
              ;;
          esac

      - name: Verify exact production build and protected contracts
        shell: bash
        env:
          BCO_DEPLOY_MODE: ${{ steps.deploy.outputs.mode }}
        run: python -m app.observability.production_verify

  publish-production-status:
    name: publish-render-production-status
    if: ${{ always() }}
    needs: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish final production status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RESULT: ${{ needs.deploy-production.result }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          result = os.environ.get("DEPLOY_RESULT", "failure")
          success = result == "success"
          payload = json.dumps({
              "state": "success" if success else "failure",
              "context": "bco/render-production",
              "description": (
                  "Render exact-build verification passed"
                  if success
                  else f"Render production verification {result}"
              )[:140],
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode("utf-8")
          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status != 201:
                  raise SystemExit(f"final status publish failed: HTTP {response.status}")
          if not success:
              raise SystemExit(f"production deploy result: {result}")
          PY
