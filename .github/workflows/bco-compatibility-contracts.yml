name: BCO Compatibility Contracts

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feature/bco-*'

permissions:
  contents: read

jobs:
  compatibility-contracts:
    name: compatibility-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: v30-v35 static compatibility boundaries
        shell: bash
        run: |
          set -euo pipefail

          # v30 — Premium Adaptive Strategy remains recommendation, never client authority.
          grep -q 'Premium Adaptive Strategy; recommendation, not player fact' app/webapp/static/bco.strategy.js
          grep -q 'evidence_driven_recommendation' app/webapp/command_center_router.py
          grep -q 'server_bco_premium' app/webapp/command_center_router.py
          grep -q 'RECOMMENDATION ≠ FACT' app/webapp/static/bco.strategy.js

          # v31 — Effectiveness remains explicit-outcome association only.
          grep -q 'bco_premium_strategy_outcomes_v31' app/services/operator_intelligence/strategy_outcomes.py
          grep -q 'strategy_effectiveness_is_associative' app/services/operator_intelligence/strategy_outcomes.py
          grep -q 'causal_claims.*False' app/services/operator_intelligence/strategy_outcomes.py
          grep -q 'explicit_outcome_association_only' app/webapp/command_center_router.py
          grep -q 'EFFECTIVENESS ≠ CAUSAL PROOF' app/webapp/static/bco.strategy.js

          # v32 — Portfolio calibration remains its own stable compatibility boundary.
          grep -q 'bco_strategy_portfolio_v32' app/services/operator_intelligence/strategy_portfolio.py
          grep -q 'minimum_evaluated_windows' app/services/operator_intelligence/strategy_portfolio.py
          grep -q 'insufficient_data_preserves_exploration' app/services/operator_intelligence/strategy_portfolio.py
          grep -q 'no_strategy_class_is_permanently_blocked' app/services/operator_intelligence/strategy_portfolio.py
          grep -q 'portfolio_priority_is_associative' app/services/operator_intelligence/adaptive_strategy.py
          grep -q 'associative_outcome_calibration_only' app/webapp/command_center_router.py
          grep -q 'PORTFOLIO PRIOR ≠ CAUSAL PROOF' app/webapp/static/bco.strategy.js

          # v33 — Exploration is deterministic and cannot override a strong signal.
          grep -q 'bco_adaptive_exploration_budget_v33' app/services/operator_intelligence/exploration_budget.py
          grep -q 'REPEAT_LIMIT = 2' app/services/operator_intelligence/exploration_budget.py
          grep -q 'CLOSE_SCORE_GAP = 6' app/services/operator_intelligence/exploration_budget.py
          grep -q 'random_selection.*False' app/services/operator_intelligence/exploration_budget.py
          grep -q 'strong_signal_override' app/services/operator_intelligence/exploration_budget.py
          grep -q 'deterministic_evidence_backed_rotation_only' app/webapp/command_center_router.py
          grep -q 'EXPLORATION ≠ RANDOMNESS' app/webapp/static/bco.strategy.js
          grep -q 'ROTATION REQUIRES CLOSE EVIDENCE' app/webapp/static/bco.strategy.js
          grep -q 'ASSOCIATION ≠ CAUSATION' app/webapp/static/bco.strategy.js

          # v34 — Freshness changes current relevance, never historical truth.
          grep -q 'bco_evidence_freshness_v34' app/services/operator_intelligence/evidence_freshness.py
          grep -q 'FRESH_MAX_DAYS = 7' app/services/operator_intelligence/evidence_freshness.py
          grep -q 'AGING_MAX_DAYS = 21' app/services/operator_intelligence/evidence_freshness.py
          grep -q 'stale_is_not_false' app/services/operator_intelligence/evidence_freshness.py
          grep -q 'missing_timestamp_remains_unknown' app/services/operator_intelligence/evidence_freshness.py
          grep -q 'old_support_is_not_current_proof' app/services/operator_intelligence/evidence_freshness.py
          grep -q 'server_persisted_evidence_timestamps_only' app/webapp/command_center_router.py
          grep -q 'STALE ≠ FALSE' app/webapp/static/bco.strategy.js
          grep -q 'OLD SUPPORT ≠ CURRENT PROOF' app/webapp/static/bco.strategy.js

          # v35 — Regime shifts require sustained explicit-outcome windows and never identify cause/meta.
          grep -q 'bco_player_regime_change_v35' app/services/operator_intelligence/regime_change.py
          grep -q 'MIN_CANDIDATE_CYCLES = 6' app/services/operator_intelligence/regime_change.py
          grep -q 'MIN_CONFIRMED_CYCLES = 9' app/services/operator_intelligence/regime_change.py
          grep -q 'WINDOW_SIZE = 3' app/services/operator_intelligence/regime_change.py
          grep -q 'one_session_can_change_regime' app/services/operator_intelligence/regime_change.py
          grep -q 'shift_does_not_identify_cause' app/services/operator_intelligence/regime_change.py
          grep -q 'external_meta_change_not_inferred' app/services/operator_intelligence/regime_change.py
          grep -q 'stale_evidence_cannot_confirm_current_shift' app/services/operator_intelligence/regime_change.py
          grep -q 'vod_contradiction_cannot_confirm_shift' app/services/operator_intelligence/regime_change.py
          grep -q 'bco_premium_adaptive_strategy_v35' app/services/operator_intelligence/adaptive_strategy.py
          grep -q 'server_explicit_outcome_windows_only' app/webapp/command_center_router.py
          grep -q 'SHIFT ≠ CAUSE' app/webapp/static/bco.strategy.js
          grep -q 'ONE SESSION ≠ REGIME' app/webapp/static/bco.strategy.js
          grep -q 'META CHANGE NOT INFERRED' app/webapp/static/bco.strategy.js

  compatibility-production-smoke:
    name: compatibility-production-smoke
    needs: compatibility-contracts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRODUCTION_URL: https://ggbf6-warzon-bot.onrender.com
    steps:
      - name: Checkout release contract
        uses: actions/checkout@v4

      - name: Verify accumulated v30-v35 production boundaries
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(python -c 'from app.release import APP_VERSION; print(APP_VERSION)')"
          EXPECTED_CONTRACT="$(python -c 'from app.release import RELEASE_CONTRACT; print(RELEASE_CONTRACT)')"

          for attempt in $(seq 1 60); do
            health_code="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/bco-health.json -w '%{http_code}' "${PRODUCTION_URL}/health/details" || true)"
            if [ "${health_code}" = "200" ]; then
              if EXPECTED_VERSION="${EXPECTED_VERSION}" EXPECTED_CONTRACT="${EXPECTED_CONTRACT}" python - <<'PY'
          import json, os
          from pathlib import Path
          try:
              p = json.loads(Path('/tmp/bco-health.json').read_text())
          except Exception:
              raise SystemExit(1)
          recovery = ((p.get('storage') or {}).get('recovery') or {})
          op = p.get('operator_intelligence') or {}
          f = p.get('features') or {}
          release = p.get('release') or {}
          ok = (
              release.get('version') == os.environ['EXPECTED_VERSION']
              and release.get('contract') == os.environ['EXPECTED_CONTRACT']
              and p.get('status') == 'ready'
              and recovery.get('primary_available') is True
              and recovery.get('last_probe_ok') is True
              and int(recovery.get('outbox_pending') or 0) == 0
              and f.get('premium_deep_history') is True
              and f.get('premium_deep_history_server_authoritative') is True
              and f.get('premium_client_authority') is False
              and op.get('premium_deep_history_authority') == 'server_bco_premium'
              and op.get('longitudinal_causal_claims') is False
              and f.get('operator_evidence_freshness') is True
              and f.get('operator_stale_evidence_not_false') is True
              and f.get('operator_freshness_no_causal_claims') is True
              and op.get('evidence_freshness') is True
              and op.get('evidence_freshness_schema') == 'bco_evidence_freshness_v34'
              and op.get('evidence_freshness_authority') == 'server_persisted_evidence_timestamps_only'
              and int(op.get('evidence_freshness_fresh_max_days') or 0) == 7
              and int(op.get('evidence_freshness_aging_max_days') or 0) == 21
              and op.get('stale_evidence_is_false') is False
              and op.get('freshness_causal_claims') is False
              and f.get('operator_regime_change_detection') is True
              and f.get('operator_regime_requires_sustained_windows') is True
              and f.get('operator_regime_one_session_not_enough') is True
              and f.get('operator_regime_no_causal_claims') is True
              and f.get('operator_regime_external_meta_not_inferred') is True
              and op.get('regime_change_detection') is True
              and op.get('regime_change_schema') == 'bco_player_regime_change_v35'
              and op.get('regime_change_authority') == 'server_explicit_outcome_windows_only'
              and int(op.get('regime_minimum_candidate_cycles') or 0) == 6
              and int(op.get('regime_minimum_confirmed_cycles') or 0) == 9
              and int(op.get('regime_window_size') or 0) == 3
              and op.get('regime_one_session_can_change') is False
              and op.get('regime_shift_identifies_cause') is False
              and op.get('regime_external_meta_inferred') is False
              and op.get('regime_causal_claims') is False
          )
          raise SystemExit(0 if ok else 1)
          PY
              then
                js_code="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/bco-strategy.js -w '%{http_code}' "${PRODUCTION_URL}/webapp/bco.strategy.js" || true)"
                api_code="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/bco-strategy-api.json -w '%{http_code}' "${PRODUCTION_URL}/webapp/api/operator-strategy" || true)"
                if [ "${js_code}" = "200" ] && [ "${api_code}" = "401" ] && \
                   grep -q 'Premium Adaptive Strategy; recommendation, not player fact' /tmp/bco-strategy.js && \
                   grep -q 'RECOMMENDATION ≠ FACT' /tmp/bco-strategy.js && \
                   grep -q 'EFFECTIVENESS ≠ CAUSAL PROOF' /tmp/bco-strategy.js && \
                   grep -q 'PORTFOLIO PRIOR ≠ CAUSAL PROOF' /tmp/bco-strategy.js && \
                   grep -q 'EXPLORATION ≠ RANDOMNESS' /tmp/bco-strategy.js && \
                   grep -q 'ROTATION REQUIRES CLOSE EVIDENCE' /tmp/bco-strategy.js && \
                   grep -q 'STALE ≠ FALSE' /tmp/bco-strategy.js && \
                   grep -q 'OLD SUPPORT ≠ CURRENT PROOF' /tmp/bco-strategy.js && \
                   grep -q 'SHIFT ≠ CAUSE' /tmp/bco-strategy.js && \
                   grep -q 'ONE SESSION ≠ REGIME' /tmp/bco-strategy.js && \
                   grep -q 'META CHANGE NOT INFERRED' /tmp/bco-strategy.js && \
                   grep -q 'server-authoritative Premium' /tmp/bco-strategy.js; then
                  echo "compatibility production verified: version=${EXPECTED_VERSION}, contract=${EXPECTED_CONTRACT}, v30-v35 boundaries=ON, unauth_strategy=401"
                  exit 0
                fi
              fi
            fi
            echo "compatibility attempt=${attempt}/60 health=${health_code:-000} not ready"
            sleep 10
          done

          echo 'accumulated compatibility production contract failed'
          cat /tmp/bco-health.json 2>/dev/null || true
          exit 1
